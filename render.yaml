services:
  - type: web
    name: n8n-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: N8N_PORT
        value: "10000"
      - key: PORT
        value: "10000"
      - key: N8N_HOST
        value: "0.0.0.0"
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_PUSH_BACKEND
        value: sse
      - key: NODE_OPTIONS
        value: "--max-old-space-size=380"
      - key: N8N_RUNNERS_MODE
        value: internal
      - key: N8N_RUNNERS_GRANT_TOKEN_TTL
        value: "300"
      - key: N8N_PYTHON_ENABLED
        value: "false"
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        value: dpg-dbmaf08ae00c738qr0p0-a
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: n8n_wlze
      - key: DB_POSTGRESDB_USER
        value: n8n
      - key: DB_POSTGRESDB_PASSWORD
        sync: false
      - key: DB_PING_TIMEOUT_MS
        value: "60000"
      - key: DB_SQLITE_VACUUM_ON_STARTUP
        value: "false"
      - key: EXECUTIONS_DATA_PRUNE
        value: "true"
      - key: EXECUTIONS_DATA_MAX_AGE
        value: "48"
      - key: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: none
      - key: N8N_ENCRYPTION_KEY
        sync: false
      - key: N8N_EDITOR_BASE_URL
        value: https://n8n-server-vkz2.onrender.com/
      - key: WEBHOOK_URL
        value: https://n8n-server-vkz2.onrender.com/
      - key: GEMINI_API_KEY
        sync: false
      - key: N8N_BASIC_AUTH_ACTIVE
        value: "false"
      - key: N8N_BASIC_AUTH_USER
        sync: false
      - key: N8N_BASIC_AUTH_PASSWORD
        sync: false
